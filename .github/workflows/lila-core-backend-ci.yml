name: Lila Core Backend CI

on:
  # The foundation branch is the first point in the stacked Core chain that
  # can carry this workflow to every descendant PR.
  push:
    branches:
      - feature/lila-core-foundation
      - feature/lila-core-context-memory
      - feature/lila-core-turn-service
      - feature/lila-core-authenticated-api
      - feature/lila-core-durable-history-memory
      - feature/lila-core-openai-compatible-composition
      - feature/lila-provider-model-discovery
      - feature/lila-encrypted-provider-registry
      - feature/galaxy-lila-core-chat-client
    paths:
      - "backend/**"
      - ".github/workflows/lila-core-backend-ci.yml"
  pull_request:
    branches:
      - "feature/lila-core-*"
      - "feature/lila-provider-*"
    paths:
      - "backend/**"

jobs:
  backend-test:
    name: Lila Core backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare ephemeral Compose secret validation environment
        run: |
          cp .env.example .env
          test_key="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$test_key"
          printf 'LILA_STORAGE_ENCRYPTION_KEY=%s\n' "$test_key" >> "$GITHUB_ENV"
          unset test_key

      - name: Validate Compose configuration and build backend image
        run: |
          docker compose config --quiet
          docker compose build backend

      - name: Verify Lila named volume survives container recreation
        run: |
          docker compose run --rm --no-deps --entrypoint python backend -c "from pathlib import Path; p = Path('/var/lib/galaxy/lila/.volume-smoke'); p.write_text('lila-volume-ok')"
          docker compose run --rm --no-deps --entrypoint python backend -c "from pathlib import Path; p = Path('/var/lib/galaxy/lila/.volume-smoke'); assert p.read_text() == 'lila-volume-ok'; p.unlink()"

      - name: Run complete backend regression suite
        run: python -m pytest -q

      - name: Remove temporary Compose environment
        if: always()
        run: rm -f .env
