name: Galaxy Development Report

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: galaxy-development-report-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Build development report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const generatedAt = new Date().toISOString();

            let runs;
            if (context.eventName === 'workflow_run') {
              runs = [context.payload.workflow_run];
            } else {
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'android-ci.yml', per_page: 10
              });
              runs = response.data.workflow_runs;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', sort: 'updated', direction: 'desc', per_page: 100
            });

            const lines = [
              '# Galaxy development report',
              '',
              `Generated at: ${generatedAt} (UTC)`,
              `Trigger: ${context.eventName}`,
              ''
            ];

            if (runs.length) {
              lines.push('## Android CI');
              for (const run of runs) {
                lines.push(
                  `### ${run.name} #${run.run_number} — ${run.conclusion || run.status}`,
                  '',
                  `- Branch: ${run.head_branch}`,
                  `- Commit: \`${run.head_sha.slice(0, 12)}\``,
                  `- Event: ${run.event}`,
                  `- Started: ${run.created_at}`,
                  `- Updated: ${run.updated_at}`,
                  `- Run: ${run.html_url}`
                );
                try {
                  const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                    owner, repo, run_id: run.id, per_page: 100
                  });
                  for (const job of jobsResponse.data.jobs) {
                    lines.push(`- Job **${job.name}**: ${job.conclusion || job.status}`);
                  }
                } catch (error) {
                  lines.push(`- Job details unavailable: ${error.message}`);
                }
                lines.push('');
              }
            } else {
              lines.push('## Android CI', '', 'No workflow runs were returned.', '');
            }

            lines.push('## Open pull requests', '');
            if (pulls.length) {
              for (const pr of pulls) {
                lines.push(
                  `- [#${pr.number} ${pr.title}](${pr.html_url}) — ${pr.draft ? 'draft' : 'ready for review'}; updated ${pr.updated_at}`
                );
              }
            } else {
              lines.push('No open pull requests.');
            }

            lines.push('', '---', 'This report is generated automatically by Galaxy Development Report.');
            const report = lines.join('\n') + '\n';
            fs.writeFileSync('galaxy-development-report.md', report);
            await core.summary.addRaw(report).write();

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-development-report
          path: galaxy-development-report.md
          if-no-files-found: error
          retention-days: 30
