services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - galaxy-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - galaxy-internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      GALAXY_ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      LILA_DATABASE_PATH: /var/lib/galaxy/lila/lila.sqlite3
      # Secret values are mounted as files; never expose them in container environment metadata.
      LILA_STORAGE_ENCRYPTION_KEY: ""
      LILA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/lila_storage_encryption_key
      LILA_PROVIDER_API_KEY: ""
      LILA_PROVIDER_API_KEY_FILE: /run/secrets/lila_provider_api_key
    secrets:
      - lila_storage_encryption_key
      - lila_provider_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - galaxy-lila-data:/var/lib/galaxy/lila
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - galaxy-internal

volumes:
  galaxy-redis-data:
  galaxy-lila-data:

networks:
  galaxy-internal:
    driver: bridge

secrets:
  lila_storage_encryption_key:
    environment: LILA_STORAGE_ENCRYPTION_KEY
  lila_provider_api_key:
    environment: LILA_PROVIDER_API_KEY
